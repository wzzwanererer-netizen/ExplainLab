[project]
name = "knowledge-core"
version = "0.1.0"
description = "ExplainLab Knowledge Core：独立知识核心，不依赖 Web 框架与前端，可复用于 Nesti"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_core"]