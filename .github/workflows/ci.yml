name: CI (Windows / macOS / Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-core:
    name: Python Core & Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Python workspace dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check

      - name: Run database migration check
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run pytest (backend + knowledge-core)
        run: uv run pytest -o addopts="--import-mode=importlib"

  frontend-and-desktop:
    name: Frontend & Electron Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest, TypeScript typecheck & Vite build
        working-directory: frontend
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: Verify Electron main & preload syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/quick-note-preload.cjs
